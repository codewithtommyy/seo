    <rect x="58" y="62" width="1084" height="506" fill="#511616" opacity="0.34"/>
    <polygon points="0,630 0,334 1200,96 1200,630" fill="#C5462F" opacity="0.58"/>
  </g>
  <rect x="58" y="62" width="1084" height="506" rx="28" stroke="#291113" stroke-width="5"/>

  <text x="100" y="150" fill="#F4E0CB" font-size="24" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">COINCU</text>
  <text x="94" y="306" fill="#F4E0CB" font-size="108" font-weight="900" font-family="Arial, Helvetica, sans-serif">RABBY</text>
  <text x="94" y="402" fill="#F4E0CB" font-size="108" font-weight="900" font-family="Arial, Helvetica, sans-serif">2026</text>
